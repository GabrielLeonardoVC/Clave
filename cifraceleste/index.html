<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CifraCeleste — cifras, escalas e teoria</title>
    <meta
      name="description"
      content="Cifras, escalas e teoria musical para músicos ao vivo. Repertório, missas, transposição instantânea, áudio e modo estúdio."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f7" id="meta-theme" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      /*
       * Anti-FOUC. Executa de forma síncrona no <head>, antes de qualquer
       * pintura de tela, aplicando tema e acento direto no <html>.
       * Se isso rodar depois do React, o usuário vê um flash branco.
       */
      ;(function () {
        var STORAGE = 'cifraceleste.v1'
        var pref = { theme: 'system', accent: 'royal' }
        try {
          var raw = localStorage.getItem(STORAGE)
          if (raw) {
            var data = JSON.parse(raw)
            if (data && data.ajustes) {
              pref.theme = data.ajustes.theme || 'system'
              pref.accent = data.ajustes.accent || 'royal'
            }
          }
        } catch (e) {
          /* localStorage bloqueado: segue com o padrão */
        }

        var dark =
          pref.theme === 'dark' ||
          (pref.theme === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)

        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        root.dataset.accent = pref.accent
        root.dataset.themePref = pref.theme

        // Cinza chumbo no escuro, papel quente no claro.
        var bg = dark ? 'rgb(20 23 28)' : 'rgb(250 249 247)'
        var meta = document.getElementById('meta-theme')
        if (meta) meta.setAttribute('content', bg)
        document.documentElement.style.backgroundColor = bg
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #1a1d23">
        <h1 style="font-size: 1.25rem">CifraCeleste precisa de JavaScript</h1>
        <p>Ative o JavaScript para usar o aplicativo.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
