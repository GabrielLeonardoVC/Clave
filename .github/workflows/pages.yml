name: Publicar no GitHub Pages

# Publica o CifraCeleste em https://gabrielleonardovc.github.io/Cifras-pro/
#
# A raiz do repositório ainda guarda o app antigo (Acorde, sem build). O que
# vai ao ar é somente cifraceleste/dist — por isso o `working-directory` em
# todos os passos e o `path` explícito no upload.

on:
  push:
    branches: [main]
    paths:
      - 'cifraceleste/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; uma nova cancela a que ainda está rodando.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cifraceleste/package-lock.json

      - name: Instalar dependências
        working-directory: cifraceleste
        # `npm ci` e não `npm install`: instala exatamente o package-lock,
        # e falha se ele estiver fora de sincronia com o package.json.
        run: npm ci

      # O typecheck já roda dentro de `npm run build` (tsc -b && vite build).
      # Publicar mesmo assim garante que o que vai ao ar foi testado.
      - name: Testar
        working-directory: cifraceleste
        run: npm test

      - name: Compilar
        working-directory: cifraceleste
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cifraceleste/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
