name: Publicar no GitHub Pages

# Publica o Acorde em https://gabrielleonardovc.github.io/Cifras-pro/
#
# O Acorde e um app puro: sem build, sem dependencia, sem passo de compilacao.
# O `index.html` da raiz ja e o produto final. Por isso este workflow nao
# instala nada e nao roda npm — ele monta a pasta que vai ao ar e publica.
#
# A lista de arquivos e explicita de proposito. Subir a raiz inteira levaria
# junto tools/, package.json e o proprio .git, que nao pertencem ao site e
# tornariam a publicacao lenta e maior do que precisa.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; uma nova cancela a que ainda esta rodando.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os testes
        # Publicar sem rodar os testes publicaria um defeito novo sem aviso.
        # Nao ha npm install porque nao ha dependencia: os testes rodam em Node
        # puro, com o que ja veio na imagem.
        run: npm run verificar

      - name: Montar o que vai ao ar
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp -r css js assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
